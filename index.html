<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>Akademik Kokpit · Onay</title>
<link rel="stylesheet" href="onay.css?v=1.0.1">
</head>
<body>
<main>
  <h1 id="baslik">Akademik Kokpit · Onay</h1>
  <section id="kart" class="kart">
    <p id="ozet" class="ozet">Hazırlanıyor…</p>
    <dl id="ayrinti" class="ayrinti" hidden></dl>
    <button id="dugme" type="button" hidden></button>
    <p id="durum" class="durum" role="status" aria-live="polite"></p>
    <div id="kopya" hidden>
      <p>Kokpit'e otomatik dönülemedi. Bu kodu kopyalayıp Kokpit'teki kutuya yapıştırın:</p>
      <textarea id="kod" readonly rows="5"></textarea>
      <button id="kopyala" type="button">Kopyala</button>
      <p id="tani" class="surum"></p>
    </div>
  </section>
  <p class="surum">Onay penceresi <span id="surum"></span></p>
</main>
<script src="onay.js?v=1.0.1"></script>
</body>
</html>
